  <g transform="translate(272 256) scale(.8) translate(-256 -256)">
    <path d="M362 150A150 150 0 1 0 362 362" fill="none" stroke="#f4b740" stroke-width="96"/>
    <path d="M362 150A150 150 0 1 0 362 362" fill="none" stroke="#0f0d13" stroke-width="24" stroke-dasharray="20 34.374" stroke-dashoffset="37.187"/>
  </g>
</svg>
