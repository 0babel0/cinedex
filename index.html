<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://image.tmdb.org; connect-src 'self' https://api.themoviedb.org https://image.tmdb.org; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0f0d13">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Cinedex — your private movie & TV diary.">
  <title>Cinedex</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <!-- Applies theme before first paint (no flash). -->
  <script src="js/boot.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Cold-start splash: pure CSS, never blocks input (pointer-events: none), removed by app.js. -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-inner">
      <img src="assets/mark.svg" alt="" width="164" height="164">
      <span>Cinedex</span>
    </div>
  </div>

  <header class="topbar">
    <a class="brand" href="#/list" aria-label="Cinedex">
      <img src="icons/favicon.svg" alt="" width="28" height="28">
      <span>Cinedex</span>
    </a>
    <span class="offline-pill" id="offline-pill" hidden data-i18n="app.offline"></span>
    <a class="icon-btn" href="#/settings" id="settings-btn" data-i18n-aria="nav.settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </a>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navigation">
    <a href="#/add" data-route="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span data-i18n="nav.add"></span>
    </a>
    <a href="#/list" data-route="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg>
      <span data-i18n="nav.list"></span>
    </a>
    <a href="#/watchlist" data-route="watchlist">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.5L5 21V4.5a1 1 0 0 1 1-1Z"/></svg>
      <span data-i18n="nav.watchlist"></span>
    </a>
    <a href="#/stats" data-route="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span data-i18n="nav.stats"></span>
    </a>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
